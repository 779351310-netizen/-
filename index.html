function periodInfo(){
  if(!periods||periods.length<3||periods.some(x=>!x.start||!x.end))return null;
  const starts=periods.map(x=>new Date(x.start+'T00:00:00')),ends=periods.map(x=>new Date(x.end+'T00:00:00'));
  if(starts.some(isNaN)||ends.some((x,i)=>x<starts[i]))return null;
  const a=(starts[1]-starts[0])/86400000,b=(starts[2]-starts[1])/86400000;
  if(a<20||a>45||b<20||b>45)return null;
  const avg=Math.round((a+b)/2),next=new Date(starts[2].getTime()+avg*86400000),today=new Date();today.setHours(0,0,0,0);
  return {avg:avg,date:next.toLocaleDateString('zh-CN'),days:Math.ceil((next-today)/86400000)};
}

function prepareOutingPhoto(input){
  const file=input.files&&input.files[0];if(!file)return;
  const reader=new FileReader();reader.onload=()=>{const photo=new Image();photo.onload=()=>{const scale=Math.min(1,1000/Math.max(photo.width,photo.height)),canvas=document.createElement('canvas');canvas.width=Math.round(photo.width*scale);canvas.height=Math.round(photo.height*scale);canvas.getContext('2d').drawImage(photo,0,0,canvas.width,canvas.height);outingDraftPhoto=canvas.toDataURL('image/jpeg',.8);document.getElementById('outing-photo-preview').innerHTML='<img src="'+outingDraftPhoto+'" alt="待分享的店铺照片">'};photo.onerror=()=>toast('照片读取失败，请换一张试试');photo.src=reader.result};reader.onerror=()=>toast('照片读取失败，请重试');reader.readAsDataURL(file);

function outOfChina(lon,lat){return lon<72.004||lon>137.8347||lat<.8293||lat>55.8271}
function transformLat(x,y){let v=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));v+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;v+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;v+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;return v}
function transformLon(x,y){let v=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));v+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;v+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;v+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;return v}
function toGcj(lon,lat){if(outOfChina(lon,lat))return {lon,lat};const a=6378245,ee=.00669342162296594323,rad=lat/180*Math.PI;let dLat=transformLat(lon-105,lat-35),dLon=transformLon(lon-105,lat-35),magic=Math.sin(rad);magic=1-ee*magic*magic;const sqrt=Math.sqrt(magic);dLat=dLat*180/((a*(1-ee))/(magic*sqrt)*Math.PI);dLon=dLon*180/(a/sqrt*Math.cos(rad)*Math.PI);return {lon:lon+dLon,lat:lat+dLat}}
function distanceMeters(a,b){const rad=Math.PI/180,dl=(b.lat-a.lat)*rad,dn=(b.lon-a.lon)*rad,h=Math.sin(dl/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dn/2)**2;return 6371000*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}
function showOutingDistance(id){const place=outings.find(x=>x.id===id);if(!place)return;if(place.lat===''||place.lng===''||place.lat==null||place.lng==null)return toast('这家店还没标注精确位置');if(!navigator.geolocation)return toast('当前浏览器不支持定位');navigator.geolocation.getCurrentPosition(pos=>{const here=toGcj(pos.coords.longitude,pos.coords.latitude),target=place.coordinateSystem==='wgs84'?toGcj(Number(place.lng),Number(place.lat)):{lon:Number(place.lng),lat:Number(place.lat)};const meters=distanceMeters(here,target);distanceCache[id]=meters<1000?'离你约 '+Math.round(meters)+' 米':'离你约 '+(meters/1000).toFixed(1)+' 公里';discover()},err=>toast(err.code===1?'请允许浏览器使用定位后查看距离':'定位失败，请稍后再试'),{enableHighAccuracy:true,timeout:12000,maximumAge:30000})}
function navigateOuting(id){const place=outings.find(x=>x.id===id);if(!place)return;let url;if(place.lat!==''&&place.lng!==''&&place.lat!=null&&place.lng!=null){const point=place.coordinateSystem==='wgs84'?toGcj(Number(place.lng),Number(place.lat)):{lon:Number(place.lng),lat:Number(place.lat)};const destination=encodeURIComponent(point.lon.toFixed(6)+','+point.lat.toFixed(6)+','+place.name);url='https://uri.amap.com/navigation?to='+destination+'&mode=walk&policy=0&src=couplekitchen&callnative=1'}else{url='https://uri.amap.com/search?keyword='+encodeURIComponent(place.name+' '+(place.address||''))+'&view=map&src=couplekitchen&callnative=1'}window.open(url,'_blank','noopener')}
function addRecipePhoto(input){
  if(gender!=='female')return toast('只有女生可以分享外食灵感');
  const file=input.files&&input.files[0];if(!file)return;
  const name=prompt('这道菜叫什么名字？');if(!name||!name.trim()){input.value='';return}
  const raw=prompt('你看到或尝到哪些原材料？可以先填写猜测，男生之后还能补充。','');
  const want=Number(prompt('想吃指数几颗星？请输入 1 到 5。','5'));
  if(!Number.isInteger(want)||want<1||want>5){toast('想吃指数要填写 1 到 5 颗星');input.value='';return}
  const reader=new FileReader();reader.onload=()=>{
    const source=new Image();source.onload=()=>{
      const scale=Math.min(1,1000/Math.max(source.width,source.height)),canvas=document.createElement('canvas');canvas.width=Math.round(source.width*scale);canvas.height=Math.round(source.height*scale);
      canvas.getContext('2d').drawImage(source,0,0,canvas.width,canvas.height);
      recipes.unshift({id:String(Date.now()),name:name.trim(),ingredients:(raw||'').split(/[、,，]/).map(x=>x.trim()).filter(Boolean),want,src:canvas.toDataURL('image/jpeg',.82),intention:'taste',response:'learning',author:'女生',createdAt:new Date().toLocaleDateString('zh-CN')});
      persist();discover();toast('这道心动美食收藏好啦 ⭐');input.value='';
    };source.onerror=()=>{toast('图片读取失败，请换一张试试');input.value=''};source.src=reader.result;
  };reader.onerror=()=>{toast('图片读取失败，请重试');input.value=''};reader.readAsDataURL(file);
}
function toggleRecipeIntention(id){if(gender!=='female')return toast('这个滑块由女生设置');const r=recipes.find(x=>x.id===id);if(!r)return;r.intention=r.intention==='menu'?'taste':'menu';persist();discover();toast(r.intention==='menu'?'加入想做菜单啦':'先记为浅尝灵感')}
function saveRecipeIngredients(id){if(gender!=='male')return toast('只有男生可以补充原材料');const r=recipes.find(x=>x.id===id);if(!r)return;const field=document.getElementById('ing-'+id);r.ingredients=(field.value||'').split(/[、,，]/).map(x=>x.trim()).filter(Boolean);persist();discover();toast('原材料补充好了')}
function toggleRecipeResponse(id){if(gender!=='male')return toast('大厨的学习状态由男生设置');const r=recipes.find(x=>x.id===id);if(!r)return;r.response=r.response==='next'?'learning':'next';persist();discover();toast(r.response==='next'?'已放进下次计划':'大厨开始研究这道菜啦')}
function feedbackHtml(o,item){
  if(o.status!=='done')return '';
  const key=String(item.id||item.name),score=Number(o.ratings?.[key]||0);
  if(gender==='female')return '<div class="meal-feedback"><span>给这道菜打分</span><div class="heart-rating">'+[1,2,3,4,5].map(n=>'<button type="button" class="heart-rate '+(n<=score?'rated':'')+'" data-order="'+esc(o.id)+'" data-item="'+encodeURIComponent(key)+'" data-star="'+n+'" aria-label="打'+n+'颗心">❤️</button>').join('')+'</div></div>';
  return '<div class="meal-feedback">'+(score?'<span>她的评分</span><span class="rating-view">'+'❤️'.repeat(score)+'<i>'+'♡'.repeat(5-score)+'</i></span>':'<span>等待女生点评</span>')+'</div>';
}
function orderPage(){
  const labels={new:gender==='female'?'等待大厨接单':'新订单，等待接单',cooking:'正在制作',ready:'饭菜做好啦',done:'一起开饭啦'};
  document.getElementById('view').innerHTML='<section class="page"><div class="eyebrow">每一份订单，都是一句“想和你一起吃”</div><div class="title">我们的点单记录</div><div class="sub">厨房更新状态后，这里会显示。</div>'+(orders.length?orders.map(o=>'<div class="order"><div class="foot"><div><div class="orderTitle">'+labels[o.status]+'</div><div class="meta">'+o.time+'</div></div><span class="state">'+labels[o.status]+'</span></div><div class="meal-items">'+o.items.map(x=>'<div class="orderitem">🍽️ '+esc(x.name)+' ×'+x.qty+feedbackHtml(o,x)+'</div>').join('')+'</div>'+
  (o.status==='new'&&gender==='male'?'<div class="actions"><button class="btn" onclick="advance(\''+o.id+'\')">开始制作</button></div>':'')+
  (o.status==='cooking'&&gender==='male'?'<div class="actions"><button class="btn" onclick="advance(\''+o.id+'\')">饭菜做好啦 ♡</button></div>':'')+
  (o.status==='ready'&&gender==='female'?'<div class="actions"><button class="btn soft" onclick="advance(\''+o.id+'\')">一起开饭</button></div>':'')+'</div>').join(''):'<div class="card empty">🥣<p>还没有订单</p><button class="btn" onclick="go(\'menu\')">逛逛菜单</button></div>')+'</section>';
  document.querySelectorAll('.heart-rate').forEach(button=>button.onclick=()=>rateDish(button.dataset.order,decodeURIComponent(button.dataset.item),Number(button.dataset.star)));
}
function profile(){
  let p=periodInfo(),female=gender==='female';
  let dateFields=periods.map((x,i)=>'<div class="period-row"><b>第 '+(i+1)+' 次</b><label class="hint">开始日期<input class="form" type="date" id="ps'+i+'" value="'+esc(x.start||'')+'" '+(!female?'disabled':'')+'></label><label class="hint">结束日期<input class="form" type="date" id="pe'+i+'" value="'+esc(x.end||'')+'" '+(!female?'disabled':'')+'></label></div>').join('');
  document.getElementById('view').innerHTML='<section class="page"><div class="eyebrow">只属于你们两个人</div><div class="title">我的</div><div class="card profile-card"><div class="avatar '+(female?'cat-avatar':'dog-avatar')+'"></div><div><h3>'+(female?'吃货小可爱':'厨房主理人')+'</h3><div class="sub">当前身份：'+(female?'女生 · 淡粉主题':'男生厨师 · 淡蓝主题')+'</div></div><button class="textbtn" onclick="setGender(\''+(female?'male':'female')+'\')">切换身份</button></div><div class="card">'+
  (female?'<div class="heads" style="margin-top:0"><strong>生理期记录</strong><span class="tag">仅女生可录入</span></div><div class="sub">记录最近三次生理期的开始和结束日期，系统根据开始日期估算周期。</div><div class="period-list">'+dateFields+'</div><button class="btn" style="width:100%;margin-top:10px" onclick="savePeriods()">保存三次记录</button>'+(p?'<div class="forecast">平均周期约 <b>'+p.avg+' 天</b><br>预计下次开始：<b>'+esc(p.date)+'</b>（约 '+p.days+' 天后）</div>':'<p class="hint">请完整填写三次生理期的开始和结束日期后保存。</p>'):'<div class="heads" style="margin-top:0"><strong>生理期记录</strong><span class="tag">男生只读</span></div><div class="sub">由女生录入三次生理期区间后显示预测。</div>'+(p?'<div class="forecast">预计下次开始：<b>'+esc(p.date)+'</b><br>平均周期约 '+p.avg+' 天。</div>':''))+
  '</div><div class="card"><strong>饭菜做好提醒</strong><p class="sub">演示版状态会保存在本浏览器里。</p></div><p class="hint">周期预测根据记录日期估算，可能有波动。</p></section>';
}
function setGender(g){gender=g;persist();render();toast(g==='female'?'已切换为淡粉主题':'已切换为淡蓝主题')}
function savePeriods(){
  if(gender!=='female')return toast('只有女生可以录入生理期');
  let next=[0,1,2].map(i=>({start:document.getElementById('ps'+i).value,end:document.getElementById('pe'+i).value}));
  if(next.some(x=>!x.start||!x.end))return toast('请填写三次生理期的开始和结束日期');
  if(next.some(x=>x.end<x.start))return toast('结束日期不能早于开始日期');
  if(next.some((x,i)=>i>0&&x.start<=next[i-1].start))return toast('请按时间顺序填写三次记录');
  let gaps=next.slice(1).map((x,i)=>(new Date(x.start+'T00:00:00')-new Date(next[i].start+'T00:00:00'))/86400000);
  if(gaps.some(x=>x<20||x>45))return toast('相邻开始日期间隔请控制在20至45天');
  periods=next;persist();render();toast('三次生理期区间已保存');
}
function change(id,n){cart[id]=Math.max(0,(cart[id]||0)+n);if(!cart[id])delete cart[id];persist();render()}
function toggleAvailability(id){if(gender!=='male')return toast('只有男生可以调整菜品状态');let d=dishes.find(x=>String(x.id)===String(id));if(!d)return;d.deferred=!d.deferred;if(d.deferred)delete cart[d.id];persist();menu();toast(d.deferred?'已放到下次吧':'这道菜现在可点啦')}
function rateDish(orderId,itemKey,stars){if(gender!=='female')return toast('只有女生可以点评');let order=orders.find(x=>x.id===orderId);if(!order||order.status!=='done')return toast('吃完饭后再来点评吧');order.ratings=order.ratings||{};order.ratings[itemKey]=Math.max(1,Math.min(5,Number(stars)||1));persist();orderPage();toast('心意收到啦 ❤️')}
function place(){let items=dishes.filter(d=>cart[d.id]).map(d=>({id:d.id,name:d.name,qty:cart[d.id]}));if(!items.length)return;orders.unshift({id:String(Date.now()),items:items,status:'new',ratings:{},time:new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})});cart={};persist();tab='orders';render();toast('下单成功，厨房收到啦 ♡')}
function advance(id){let o=orders.find(x=>x.id===id);if(!o)return;if(o.status==='new'&&gender==='male'){o.status='cooking';toast('开始为宝宝做饭啦 ♡')}else if(o.status==='cooking'&&gender==='male'){o.status='ready';toast('饭菜做好啦，快叫宝宝来吃饭 💌')}else if(o.status==='ready'&&gender==='female'){o.status='done';o.ratings=o.ratings||{};toast('一起开饭啦 ♡')}else return toast(gender==='female'?'等大厨更新订单进度哦':'请按订单状态完成当前步骤');persist();orderPage()}
function addDish(){
  let name=prompt('菜品叫什么名字？');if(!name)return;
  let d={id:String(Date.now()),name:name.trim(),cat:'家常菜',mins:20,desc:'为你认真准备的一道菜。',emoji:'🍳'};
  let input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=()=>{let f=input.files[0];if(f){let rd=new FileReader();rd.onload=()=>{d.src=rd.result;finish()};rd.readAsDataURL(f)}else finish()};
  function finish(){dishes.unshift(d);persist();tab='menu';render();toast('新菜品上架啦 ♡')}input.click();
}
function go(t){tab=t;render()}
function render(){tabs();if(tab==='home')home();else if(tab==='menu')menu();else if(tab==='discover')discover();else if(tab==='orders')orderPage();else profile()}
document.getElementById('nav').onclick=e=>{let b=e.target.closest('button[data-tab]');if(b){tab=b.dataset.tab;render()}}
render();
</script></body></html>
